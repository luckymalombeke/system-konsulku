
<style>
#erd { padding: 1rem 0; }
#erd svg { max-width: 100%; }
.mermaid-err { color: var(--color-text-danger); font-size: 13px; padding: 1rem; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f1efe8',
    primaryBorderColor: dark ? '#5f5e5a' : '#b4b2a9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  fakultas {
    int id PK
    varchar nama
    varchar singkatan
    timestamp created_at
  }
  prodi {
    int id PK
    varchar nama
    enum jenjang
    int fakultas_id FK
    timestamp created_at
  }
  users {
    int id PK
    varchar username
    varchar password
    enum role
    varchar email
    boolean is_active
    timestamp created_at
    timestamp updated_at
  }
  dosen {
    int id PK
    int user_id FK
    varchar nip
    varchar nama_lengkap
    varchar gelar_belakang
    varchar jabatan
    int prodi_id FK
    varchar foto
    boolean is_available
    timestamp created_at
  }
  mahasiswa {
    int id PK
    int user_id FK
    varchar nim
    varchar nama_lengkap
    int prodi_id FK
    tinyint semester
    year angkatan
    varchar foto
    timestamp created_at
  }
  appointment {
    int id PK
    int mahasiswa_id FK
    int dosen_id FK
    varchar topik
    text deskripsi
    date tanggal_request
    time jam_request
    enum jenis
    enum status
    date reschedule_tanggal
    time reschedule_jam
    text reschedule_catatan
    text alasan_penolakan
    text catatan_hasil
    timestamp created_at
    timestamp updated_at
  }
  appointment_lampiran {
    int id PK
    int appointment_id FK
    varchar nama_file
    varchar path_file
    int ukuran_bytes
    varchar mime_type
    timestamp uploaded_at
  }
  konsultasi_chat {
    int id PK
    int mahasiswa_id FK
    int dosen_id FK
    timestamp dibuat_pada
  }
  pesan {
    int id PK
    int chat_id FK
    int pengirim_id FK
    text teks
    boolean is_file
    boolean dibaca
    timestamp dikirim_at
  }
  pesan_lampiran {
    int id PK
    int pesan_id FK
    varchar nama_file
    varchar path_file
    int ukuran_bytes
    varchar mime_type
  }
  notifikasi {
    int id PK
    int user_id FK
    varchar judul
    text pesan
    enum tipe
    int referensi_id
    boolean is_read
    timestamp created_at
  }

  fakultas ||--o{ prodi : "memiliki"
  prodi ||--o{ dosen : "bernaung di"
  prodi ||--o{ mahasiswa : "bernaung di"
  users ||--|| dosen : "akun"
  users ||--|| mahasiswa : "akun"
  mahasiswa ||--o{ appointment : "mengajukan"
  dosen ||--o{ appointment : "menerima"
  appointment ||--o{ appointment_lampiran : "melampirkan"
  mahasiswa ||--o{ konsultasi_chat : "terlibat"
  dosen ||--o{ konsultasi_chat : "terlibat"
  konsultasi_chat ||--o{ pesan : "berisi"
  users ||--o{ pesan : "mengirim"
  pesan ||--o| pesan_lampiran : "melampirkan"
  users ||--o{ notifikasi : "menerima"
`;

try {
  const { svg } = await mermaid.render('erd-svg', diagram);
  document.getElementById('erd').innerHTML = svg;

  document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
    const firstPath = node.querySelector('path[d]');
    if (!firstPath) return;
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');
    for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
      if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });

  document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
    p.setAttribute('stroke', 'none');
  });
} catch(e) {
  document.getElementById('erd').innerHTML = `<div class="mermaid-err">Gagal render diagram: ${e.message}</div>`;
}
</script>
